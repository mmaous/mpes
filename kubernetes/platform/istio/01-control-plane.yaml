# CLUSTER A (US-EAST1) - PRIMARY NETWORK
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base-us
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://istio-release.storage.googleapis.com/charts'
    targetRevision: 1.30.3
    chart: base
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod-us
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://istio-release.storage.googleapis.com/charts'
    targetRevision: 1.30.3
    chart: istiod
    helm:
      values: |
        global:
          meshID: mpes-mesh
          multiCluster:
            clusterName: cluster-a
          network: network-a
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

