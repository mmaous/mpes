# tell ESO how to authenticate to GCP (Uses Workload Identity implicitly)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-store
spec:
  provider:
    gcpsm:
      projectID: mmdevops

---
# pull the US CA Certificates
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: istio-cacerts
  namespace: istio-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-store
  target:
    name: cacerts
    creationPolicy: Owner
  data:
    - secretKey: ca-cert.pem
      remoteRef:
        key: istio-us-ca-cert
    - secretKey: ca-key.pem
      remoteRef:
        key: istio-us-ca-key
    - secretKey: root-cert.pem
      remoteRef:
        key: istio-us-root-cert
    - secretKey: cert-chain.pem
      remoteRef:
        key: istio-us-cert-chain

---
#pull the eu remote token (so US can read EU endpoints)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: istio-remote-secret
  namespace: istio-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-store
  target:
    name: istio-remote-secret-cluster-b
    creationPolicy: Owner
    template:
      metadata:
        labels:
          istio/multiCluster: "true"
        annotations:
          networking.istio.io/cluster: cluster-b
  data:
    - secretKey: cluster-b
      remoteRef:
        key: istio-remote-secret-eu
