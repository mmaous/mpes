apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-secrets-us
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: 'https://github.com/mmaous/mpes.git'
    targetRevision: main
    path: kubernetes/platform/istio/secrets-us
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-secrets-eu
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: 'https://github.com/mmaous/mpes.git'
    targetRevision: main
    path: kubernetes/platform/istio/secrets-eu
  destination:
    name: cluster-b
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
