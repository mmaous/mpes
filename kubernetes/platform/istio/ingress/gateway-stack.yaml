# US CLUSTER INGRESS GATEWAY
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ingress-us
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://istio-release.storage.googleapis.com/charts'
    targetRevision: 1.30.3
    chart: gateway
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

---
# EU CLUSTER INGRESS GATEWAY
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ingress-eu
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://istio-release.storage.googleapis.com/charts'
    targetRevision: 1.30.3
    chart: gateway
  destination:
    name: cluster-b
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
