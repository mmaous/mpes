apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/mmaous/mpes
      targetRevision: main
      ref: values
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.3.0
      helm:
        valueFiles:
          - $values/kubernetes/platform/argocd/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
