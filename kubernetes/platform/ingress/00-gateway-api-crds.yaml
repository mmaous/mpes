apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds-us
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: 'https://github.com/kubernetes-sigs/gateway-api'
    targetRevision: v1.1.0
    path: config/crd
  destination:
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds-eu
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: 'https://github.com/kubernetes-sigs/gateway-api'
    targetRevision: v1.1.0
    path: config/crd
  destination:
    name: cluster-b
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
