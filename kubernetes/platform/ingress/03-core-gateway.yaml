apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mpes-gateway
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  gatewayClassName: istio
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
