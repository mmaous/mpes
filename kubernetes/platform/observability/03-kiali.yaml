# kubernetes/platform/observability/02-kiali.yaml

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali-us
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://kiali.org/helm-charts'
    targetRevision: 2.29.0
    chart: kiali-operator
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali-eu
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://kiali.org/helm-charts'
    targetRevision: 2.29.0
    chart: kiali-operator
  destination:
    name: cluster-b
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
