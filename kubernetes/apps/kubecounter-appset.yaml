apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kubecounter-fleet
  namespace: argocd
spec:
  generators:
    - cluster: {}
  template:
    metadata:
      name: 'kubecounter-{{name}}'
    spec:
      project: default
      source:
        repoURL: 'https://github.com/mmaous/kubecounter.git'
        targetRevision: dev # TODO: make it dynamic
        path: 'kube/overlays/dev' # TODO: dynamically point to overlays based on cluster
      destination:
        server: '{{server}}'
        namespace: kubecounter
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
